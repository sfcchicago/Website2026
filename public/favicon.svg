<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="circle">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>
  <!-- Circular background -->
  <circle cx="256" cy="256" r="256" fill="#3b9fc1"/>

  <!-- Logo content in circle -->
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="#3b9fc1"/>

    <!-- Sharon text (bold) -->
    <text
      x="256"
      y="215"
      font-family="Arial Black, Arial, sans-serif"
      font-weight="900"
      font-size="110"
      fill="white"
      text-anchor="middle"
      letter-spacing="-1">sharon</text>

    <!-- Fellowship church text (lighter) -->
    <text
      x="256"
      y="285"
      font-family="Arial, sans-serif"
      font-weight="300"
      font-size="48"
      fill="white"
      text-anchor="middle"
      letter-spacing="0">fellowship church</text>
  </g>
</svg>
