backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/people"
public_folder: "/people"

collections:
  - name: "settings"
    label: "Site Settings & Live Links"
    files:
      - name: "general"
        label: "General & Live Stream"
        file: "src/content/settings.json"
        fields:
          - { label: "Watch Live Link", name: "liveUrl", widget: "string", hint: "The YouTube or livestream URL" }
          - { label: "Church Phone", name: "phone", widget: "string" }
          - { label: "Church Email", name: "email", widget: "string" }
          - { label: "Church Address", name: "address", widget: "string" }
          - { label: "Giving Link (Venmo)", name: "giveUrl", widget: "string" }
          - { label: "Events Link", name: "eventsUrl", widget: "string" }
          - { label: "Bible Verse", name: "verseText", widget: "text" }
          - { label: "Bible Reference", name: "verseRef", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Facebook Link", name: "facebookUrl", widget: "string" }
          - { label: "YouTube Link", name: "youtubeUrl", widget: "string" }
          - { label: "Instagram Link", name: "instagramUrl", widget: "string" }

  - name: "services"
    label: "Weekly Services"
    files:
      - name: "schedule"
        label: "Services Schedule"
        file: "src/content/services.json"
        fields:
          - label: "Services"
            name: "items"
            widget: "list"
            fields:
              - { label: "Service Name", name: "name", widget: "string" }
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Time", name: "time", widget: "string" }
              - { label: "Description", name: "note", widget: "text" }

  - name: "pastor"
    label: "Pastor Info"
    files:
      - name: "pastor"
        label: "Senior Pastor"
        file: "src/content/pastor.json"
        fields:
          - { label: "Pastor Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - { label: "Tenure / Years", name: "since", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Biography", name: "bio", widget: "list", field: { name: "paragraph", label: "Paragraph", widget: "text" } }
          - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "about"
    label: "About & Beliefs"
    files:
      - name: "mission"
        label: "Mission & History"
        file: "src/content/mission.json"
        fields:
          - { label: "Mission Statement", name: "mission", widget: "text" }
          - { label: "Vision Points", name: "vision", widget: "list", field: { name: "point", label: "Point", widget: "string" } }
          - { label: "History", name: "history", widget: "text" }
      - name: "beliefs"
        label: "Core Beliefs"
        file: "src/content/beliefs.json"
        fields:
          - label: "Beliefs"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
      - name: "pastorHistory"
        label: "Former Pastors"
        file: "src/content/pastorHistory.json"
        fields:
          - label: "Pastors"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Years Served", name: "years", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "leadership"
    label: "Leadership & Teams"
    files:
      - name: "leadership"
        label: "Church Leadership Teams"
        file: "src/content/leadership.json"
        fields:
          - label: "Board Members"
            name: "board"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Ministerial Support"
            name: "ministerialSupport"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Sunday School Staff"
            name: "sundaySchool"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
